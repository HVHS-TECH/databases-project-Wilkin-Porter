<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Account - Wilix Games</title>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
    <script src="firebase/setup.js"></script>
	<script src="firebase/io.js"></script>
</head>
<body onload="returnButtonDisplay('hide')">
    <h1>Create Account</h1>

    <h4>You don't have some account details, please save your details to unlock full functionality!</h4>

    <form id="form">
		<label for="name">What would you like to be called? (This may be shared publicly)</label>
		<p id="nameError"></p>
		<input type="text" id="name" name="name" required />
        <br><br>
		<label for="age">How old are you? (This will not be shared with anyone)</label>
		<p id="ageError"></p>
		<input type="number" id="age" name="age" required />
	</form>

	<button id="submitButton" onclick="checkForm()">Submit</button>
	
	<p id="loginError"></p><br>

	<a id="returnButton" href="index.html">Return to home page</a>

	<script src="firebase/script.js"></script>
</body>
</html>
